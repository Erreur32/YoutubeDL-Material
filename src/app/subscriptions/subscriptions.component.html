<div class="subscriptions-page">
    <div class="subscriptions-topbar">
        <span class="subscriptions-topbar-title" i18n="Subscriptions title">Subscriptions</span>
    </div>

    <div class="subscriptions-section">
        <h3 class="subscriptions-section-title" i18n="Subscriptions channels title">Channels</h3>

        <div class="subscriptions-card" *ngIf="channel_subscriptions.length > 0">
            <div class="subscriptions-list-item" *ngFor="let sub of channel_subscriptions">
                <a class="subscriptions-item-label" (click)="goToSubscription(sub)">
                    <strong *ngIf="sub.name">{{ sub.name }}&nbsp;<ng-container *ngIf="sub.paused" i18n="Paused suffix">(Paused)</ng-container></strong>
                    <span *ngIf="!sub.name" class="subscriptions-item-pending" i18n="Subscription playlist not available text">Name not available. Channel retrieval in progress.</span>
                </a>
                <div class="subscriptions-item-actions">
                    <button matTooltip="Edit" i18n-matTooltip="Edit" mat-icon-button (click)="editSubscription(sub)">
                        <mat-icon>edit</mat-icon>
                    </button>
                    <button matTooltip="Info" i18n-matTooltip="Info" mat-icon-button (click)="showSubInfo(sub)">
                        <mat-icon>info</mat-icon>
                    </button>
                </div>
            </div>
        </div>

        <div class="subscriptions-empty" *ngIf="channel_subscriptions.length === 0 && subscriptions">
            <p i18n="No channel subscriptions text">You have no channel subscriptions.</p>
        </div>
    </div>

    <div class="subscriptions-section">
        <h3 class="subscriptions-section-title" i18n="Subscriptions playlists title">Playlists</h3>

        <div class="subscriptions-card" *ngIf="playlist_subscriptions.length > 0">
            <div class="subscriptions-list-item" *ngFor="let sub of playlist_subscriptions">
                <a class="subscriptions-item-label" (click)="goToSubscription(sub)">
                    <strong *ngIf="sub.name">{{ sub.name }}&nbsp;<ng-container *ngIf="sub.paused" i18n="Paused suffix">(Paused)</ng-container></strong>
                    <span *ngIf="!sub.name" class="subscriptions-item-pending" i18n="Subscription playlist not available text">Name not available. Channel retrieval in progress.</span>
                </a>
                <div class="subscriptions-item-actions">
                    <button matTooltip="Edit" i18n-matTooltip="Edit" mat-icon-button (click)="editSubscription(sub)">
                        <mat-icon>edit</mat-icon>
                    </button>
                    <button matTooltip="Info" i18n-matTooltip="Info" mat-icon-button (click)="showSubInfo(sub)">
                        <mat-icon>info</mat-icon>
                    </button>
                </div>
            </div>
        </div>

        <div class="subscriptions-empty" *ngIf="playlist_subscriptions.length === 0 && subscriptions">
            <p i18n="No playlist subscriptions text">You have no playlist subscriptions.</p>
        </div>
    </div>

    <div class="subscriptions-loading" *ngIf="subscriptions_loading">
        <mat-progress-bar mode="indeterminate"></mat-progress-bar>
    </div>
</div>

<button class="add-subscription-button" (click)="openSubscribeDialog()" matTooltip="Add subscription" i18n-matTooltip="Add subscription" mat-fab><mat-icon>add</mat-icon></button>
