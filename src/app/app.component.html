<div [style.background]="postsService.theme ? postsService.theme.background_color : null" style="width: 100%; height: 100%;">
    <div class="mat-elevation-z3" style="position: relative; z-index: 10;">
        <mat-toolbar class="sticky-toolbar top-toolbar">
            <div class="container-fluid" style="padding-left: 0px; padding-right: 0px">
                <div class="row" width="100%" height="100%">
                    <div class="col-6" style="text-align: left; margin-top: 1px;">
                        <div style="display: flex; align-items: center;">
                            <button #hamburgerMenu style="outline: none" *ngIf="router.url.split(';')[0] !== '/player'" mat-icon-button aria-label="Toggle side navigation" (click)="toggleSidenav()"><mat-icon>menu</mat-icon></button>
                            <button (click)="goBack()" *ngIf="router.url.split(';')[0] === '/player'" mat-icon-button><mat-icon>arrow_back</mat-icon></button>
                            <div style="margin-left: 8px; display: inline-block;"><button mat-icon-button routerLink='/home'><img style="width: 32px;" src="assets/images/logo_128px.png"></button></div>
                        </div>
                    </div>
                    <div class="col-6" style="text-align: right; align-items: flex-end; display: inline-block">
                        <button *ngIf="postsService.config?.Extra.enable_notifications" [matMenuTriggerFor]="notificationsMenu" (menuOpened)="notificationMenuOpened()" mat-icon-button><mat-icon [matBadge]="notification_count" matBadgeColor="warn" matBadgeSize="small" *ngIf="notification_count > 0">notifications</mat-icon><mat-icon *ngIf="notification_count === 0">notifications_none</mat-icon></button>
                        <mat-menu [classList]="'notifications-menu'" (close)="notificationMenuClosed()" #notificationsMenu="matMenu">
                            <app-notifications #notifications (notificationCount)="notificationCountUpdate($event)" (click)="$event.stopPropagation()"></app-notifications>
                        </mat-menu>
                        <button [matMenuTriggerFor]="menuSettings" mat-icon-button><mat-icon>more_vert</mat-icon></button>
                        <mat-menu #menuSettings="matMenu">
                            <button class="top-menu-button" (click)="openProfileDialog()" mat-menu-item>
                                <mat-icon>person</mat-icon>
                                <span i18n="Profile menu label">Profile</span>
                            </button>
                            <button *ngIf="!postsService.config?.Advanced.multi_user_mode || postsService.isLoggedIn" class="top-menu-button" (click)="openArchivesDialog()" mat-menu-item>
                                <mat-icon>topic</mat-icon>
                                <span i18n="Archives menu label">Archives</span>
                            </button>
                            <div class="theme-switch-row" *ngIf="allowThemeChange" (click)="$event.stopPropagation()">
                                <span i18n="Theme switch label">Theme</span>
                                <mat-button-toggle-group class="theme-switch-toggle" [value]="postsService.theme.key" (change)="themeToggleChanged($event)">
                                    <mat-button-toggle *ngFor="let key of themeKeys" [value]="key" [matTooltip]="key">
                                        <mat-icon>{{themeIcons[key]}}</mat-icon>
                                    </mat-button-toggle>
                                </mat-button-toggle-group>
                            </div>
                            <button class="top-menu-button" (click)="openAboutDialog()" mat-menu-item>
                                <mat-icon>info</mat-icon>
                                <span i18n="About menu label">About</span>
                            </button>
                        </mat-menu>
                    </div>
                </div>
            </div>
        </mat-toolbar>
    </div>
    <div class="sidenav-container" style="height: calc(100% - 64px)">
        <mat-sidenav-container style="height: 100%">
            <mat-sidenav class="side-nav" [opened]="postsService.sidepanel_mode === 'side' && !window.location.href.includes('/player')" [mode]="postsService.sidepanel_mode" #sidenav>
                <mat-nav-list class="side-nav-list">
                    <a *ngIf="postsService.config && (!postsService.config.Advanced.multi_user_mode || postsService.isLoggedIn)" class="side-nav-link" mat-list-item routerLink='/home' routerLinkActive #rlaHome="routerLinkActive" [routerLinkActiveOptions]="{exact: true}" [activated]="rlaHome.isActive" (click)="postsService.sidepanel_mode === 'over' ? sidenav.close() : null">
                        <mat-icon matListItemIcon>home</mat-icon>
                        <ng-container i18n="Navigation menu Home Page title">Home</ng-container>
                    </a>
                    <a *ngIf="postsService.config && postsService.config.Advanced.multi_user_mode && !postsService.isLoggedIn" class="side-nav-link" mat-list-item routerLink='/login' routerLinkActive #rlaLogin="routerLinkActive" [routerLinkActiveOptions]="{exact: true}" [activated]="rlaLogin.isActive" (click)="sidenav.close()">
                        <mat-icon matListItemIcon>login</mat-icon>
                        <ng-container i18n="Navigation menu Login Page title">Login</ng-container>
                    </a>
                    <a *ngIf="postsService.config && enableDownloadsManager && postsService.hasPermission('downloads_manager')" class="side-nav-link" mat-list-item routerLink='/downloads' routerLinkActive #rlaDownloads="routerLinkActive" [routerLinkActiveOptions]="{exact: true}" [activated]="rlaDownloads.isActive" (click)="postsService.sidepanel_mode === 'over' ? sidenav.close() : null">
                        <mat-icon matListItemIcon>cloud_download</mat-icon>
                        <ng-container i18n="Navigation menu Downloads Page title">Downloads</ng-container>
                    </a>
                    <a *ngIf="postsService.config && allowSubscriptions && postsService.hasPermission('subscriptions')" class="side-nav-link" mat-list-item routerLink='/subscriptions' routerLinkActive #rlaSubs="routerLinkActive" [routerLinkActiveOptions]="{exact: true}" [activated]="rlaSubs.isActive" (click)="postsService.sidepanel_mode === 'over' ? sidenav.close() : null">
                        <mat-icon matListItemIcon>subscriptions</mat-icon>
                        <ng-container i18n="Navigation menu Subscriptions Page title">Subscriptions</ng-container>
                    </a>
                    <a *ngIf="postsService.config && postsService.hasPermission('tasks_manager')" class="side-nav-link" mat-list-item routerLink='/tasks' routerLinkActive #rlaTasks="routerLinkActive" [routerLinkActiveOptions]="{exact: true}" [activated]="rlaTasks.isActive" (click)="postsService.sidepanel_mode === 'over' ? sidenav.close() : null">
                        <mat-icon matListItemIcon>checklist</mat-icon>
                        <ng-container i18n="Navigation menu Tasks Page title">Tasks</ng-container>
                    </a>
                    <ng-container *ngIf="postsService.config && postsService.hasPermission('settings')">
                        <mat-divider class="side-nav-divider"></mat-divider>
                        <a class="side-nav-link" mat-list-item routerLink='/settings' routerLinkActive #rlaSettings="routerLinkActive" [routerLinkActiveOptions]="{exact: true}" [activated]="rlaSettings.isActive" (click)="postsService.sidepanel_mode === 'over' ? sidenav.close() : null">
                            <mat-icon matListItemIcon>settings</mat-icon>
                            <ng-container i18n="Settings menu label">Settings</ng-container>
                        </a>
                    </ng-container>
                    <ng-container *ngIf="postsService.config && allowSubscriptions && postsService.subscriptions && postsService.hasPermission('subscriptions')">
                        <mat-divider class="side-nav-divider" *ngIf="postsService.subscriptions.length > 0"></mat-divider>
                        <a *ngFor="let subscription of postsService.subscriptions" class="side-nav-link side-nav-link--sub" mat-list-item [routerLink]="['/subscription', { id: subscription.id }]" routerLinkActive #rlaSub="routerLinkActive" [activated]="rlaSub.isActive" (click)="postsService.sidepanel_mode === 'over' ? sidenav.close() : null">
                            <ngx-avatars matListItemIcon size="28" [name]="subscription.name"></ngx-avatars>
                            <span class="side-nav-sub-label">{{subscription.name}}</span>
                        </a>
                    </ng-container>
                </mat-nav-list>
            </mat-sidenav>
            <mat-sidenav-content [style.background]="postsService.theme ? postsService.theme.background_color : null">
                <router-outlet></router-outlet>
            </mat-sidenav-content>
        </mat-sidenav-container>
    </div>
</div>
